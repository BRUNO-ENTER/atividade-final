<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1e293b">

    <!-- Configuração de App Mobile (Nova Sintaxe) -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mundo Do Esporte">

    <meta name="description" content="Mundo Do Esporte - Gerenciador e Catálogo de Produtos Eletrônicos em PWA">

    <title>Mundo Do Esporte - Catálogo de Produtos</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" href="icon.png" type="image/png">
</head>
<body>
<div class="container">
        <header class="header">
            <div class="header-brand">
                <span class="logo-icon"></span>
                <div>
                    <h1>Mundo Do Esporte</h1>
                    <p class="subtitle">Catálogo de Produtos</p>
                </div>
            </div>
            <button id="installBtn" class="btn install-btn" hidden>Instalar App</button>
        </header>

        <!-- Métricas / Resumo -->
        <section id="statsSection" class="section stats-grid">
            <div class="stat-card">
                <span class="stat-value" id="totalProdutos">0</span>
                <span class="stat-label">Produtos</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="totalEstoque">R$ 0,00</span>
                <span class="stat-label">Valor em Estoque</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="totalDisponivel">0</span>
                <span class="stat-label">Em Estoque</span>
            </div>
        </section>

        <!-- Botão para Abrir Formulário -->
        <section id="botaoNovoProdutoSection" class="section button-section">
            <button class="btn btn-large btn-success" onclick="toggleFormSection()">
                <span class="btn-icon">+</span> Novo Produto
            </button>
        </section>

        <!-- Formulário de Cadastro -->
        <section id="formSection" class="section form-section">
            <h2>Cadastrar Novo Produto</h2>
            <form id="produtoForm">
                <div class="form-group">
                    <label for="nomeProduto">Nome do Produto *</label>
                    <input type="text" id="nomeProduto" placeholder="Ex: Smartphone Galaxy S24 Ultra" required autocomplete="off">
                </div>

                <div class="form-row">
                    <div class="form-group flex-1">
                        <label for="precoProduto">Preço (R$) *</label>
                        <input type="number" id="precoProduto" step="0.01" min="0" placeholder="Ex: 2499.90" required autocomplete="off">
                    </div>

                    <div class="form-group flex-1">
                        <label for="statusProduto">Status *</label>
                        <select id="statusProduto" required>
                            <option value="Em Estoque">Em Estoque</option>
                            <option value="Esgotado">Esgotado</option>
                            <option value="Sob Encomenda">Sob Encomenda</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="imagemProduto">URL da Imagem (opcional)</label>
                    <input type="url" id="imagemProduto" placeholder="https://exemplo.com/imagem.jpg" autocomplete="off">
                    <small class="help-text">Deixe em branco para usar a imagem padrão do produto</small>
                </div>

                <div class="form-group">
                    <label for="descricaoProduto">Descrição do Produto *</label>
                    <textarea id="descricaoProduto" rows="3" placeholder="Descreva as especificações, cor, características..." required></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Salvar Produto</button>
                    <button type="button" class="btn btn-secondary" onclick="toggleFormSection()">Cancelar</button>
                </div>
            </form>
        </section>

        <!-- Lista / Catálogo de Produtos -->
        <section id="tabelaSection" class="section">
            <div class="section-header">
                <h2>Catálogo de Produtos</h2>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Buscar por nome ou descrição..." oninput="filtrarProdutos()">
                </div>
            </div>
            
            <div id="produtoList" class="produto-grid">
                <p class="empty-message">Nenhum produto cadastrado no catálogo.</p>
            </div>
        </section>
    </div>

    <footer class="footer">
        <p>Mundo Do Esporte &copy; 2026 — Controle de Catálogo &amp; Produtos (PWA)</p>
    </footer>

    <script src="app.js"></script>
</body>

</html>
